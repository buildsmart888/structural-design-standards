name: Engineering safety regression and packaging (NOT code certification)

on:
  push:
    branches: [fix/library-audit]
    paths:
      - 'structural-design-standards/**'
      - '.github/workflows/beam-safety.yml'
  pull_request:
    paths:
      - 'structural-design-standards/**'
      - '.github/workflows/beam-safety.yml'

jobs:
  engineering-safety:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: structural-design-standards
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: structural-design-standards/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile all package and test Python sources
        run: python -m compileall -q structural_standards tests
      - name: Focused independent numerical safety checks
        run: |
          python -m pytest -q -o addopts='' \
            tests/test_beam_safety_regressions.py \
            tests/test_engineering_safety_gates.py \
            tests/test_standards_corrections.py
      - name: Build distributable package
        run: |
          python -m pip install build
          python -m build
